[package]
name = "deskrat"
version = "1.0.1"
description = "DeskRat — noncommercial fork of Forecastych/DeskPartner"
authors = ["Forecastych"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.80"

[package.metadata.deskrat]
maintainer = "Konstantin Ushakov"
upstream = "https://github.com/Forecastych/DeskPartner"
purpose = "Noncommercial memorial project for Penny"

[lib]
name = "deskrat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# «В этот день» из Википедии: маленький блокирующий клиент, TLS на rustls — без OpenSSL в установщике
ureq = "3"
quick-xml = "0.42"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# «Кино вместе»: плитка воспроизведения (WinRT) и пиковый уровень звука (COM). Та же версия,
# что уже тянет tauri, так что в сборку ничего нового не приезжает.
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
